name: Android

on:
  push:
    paths:
      - "diverge-sdk/**"
      - "sample/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "VERSION"
      - "scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "diverge-sdk/**"
      - "sample/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "VERSION"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2

      - name: Check version sync
        run: ./scripts/check-version.sh

      - name: Assemble, test, lint, Dokka, sample, R8 keep check
        run: >
          ./gradlew
          :diverge-sdk:assemble
          :diverge-sdk:test
          :diverge-sdk:lint
          :diverge-sdk:dokkaHtml
          :diverge-sdk:dokkaJavadoc
          :sample:assembleDebug
          :sample:assembleRelease
          :sample:verifyR8PublicApiKeeps
          :sample:testDebugUnitTest
          --stacktrace
