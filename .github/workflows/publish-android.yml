name: Publish Android

on:
  workflow_dispatch:

concurrency:
  group: publish-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Android checks
    uses: ./.github/workflows/android.yml

  publish:
    name: Publish to Maven Central Portal
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # See android.yml: the default "tools" package no longer exists.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2
      - name: Publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishReleasePublicationToCentralPortalRepository --stacktrace
      # The Gradle upload lands in the OSSRH Staging API, which hands nothing to the Central
      # Portal on its own. This call moves it there as a user_managed deployment: it waits as
      # validated until someone clicks Publish in the Portal. It must run in this job, because
      # the staging API only accepts it from the IP that uploaded.
      - name: Hand the upload to the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          bearer="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$bearer"
          status="$(curl --silent --show-error --output portal-response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $bearer" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/ai.askdiverge?publishing_type=user_managed")"
          cat portal-response.txt; echo
          if [[ "$status" != 2* ]]; then
            echo "Central Portal transfer failed with HTTP $status" >&2
            exit 1
          fi
          echo "Deployment handed to the Portal. Review it at https://central.sonatype.com/publishing/deployments and click Publish."
